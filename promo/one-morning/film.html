<main class="film" data-film data-duration="30">
  <section class="film__scene" style="--start: 0; --end: 30">
    <div class="film__night" data-motion="fade" style="--at: 23.8; --for: 1.2">
      <p class="film__lift" data-motion="lift" style="--at: 25.8; top: 733.6px">
        صدقة جارية عن شروق
      </p>
      <div class="film__end" style="position: absolute; inset-inline: 0; top: 925px">
        <div class="film__brand" data-motion="grow" style="--at: 26.6">
          <svg class="film__mark" data-mark></svg>
          <span class="film__name">وِردي</span>
        </div>
        <span class="film__domain" data-motion="fade" style="--at: 27; --for: 0.9">wirdy.site</span>
      </div>
    </div>

    <div class="film__titles">
      <p class="film__line" data-motion="title" style="--at: -1; --out: 5.2">أذكار يومك في مكان</p>
      <p class="film__line" data-motion="title" style="--at: 5.8; --out: 15.4">مع كل ذكر تخريجه</p>
      <p class="film__line" data-motion="title" style="--at: 16; --out: 20.2">نصا أو صورة</p>
      <p class="film__line" data-motion="title" style="--at: 20.8; --out: 23.4">نهارا أو ليلا</p>
    </div>

    <div
      class="film__screen"
      data-motion="zoom"
      style="
        --screen: 520px;
        --at: 23.8;
        --for: 2;
        --out: 25.8;
        --focus: 280.3px 985.5px;
        --zoom: 3.917;
        --zoom-x: 1.5px;
        --zoom-y: -654.75px;
      "
    >
      <video
        class="film__media"
        data-clip
        data-motion="until"
        src="clips/journey.mp4"
        data-start="-6.8"
        muted
        style="--out: 18.7"
      ></video>
      <img
        class="film__media"
        data-still
        data-motion="from"
        src="clips/dhikr.png"
        alt=""
        style="--at: 18.6"
      />
      <video
        class="film__media"
        data-clip
        data-motion="fade"
        src="clips/footer.mp4"
        data-start="17.6"
        muted
        style="--at: 20.8; --for: 0.6"
      ></video>
    </div>

    <img
      class="film__card"
      src="clips/card.png"
      alt=""
      data-motion="pop"
      style="--at: 18.7; --out: 20.2"
    />
  </section>
</main>
