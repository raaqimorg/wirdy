<main class="film" data-film data-duration="16">
  <section class="film__scene" style="--start: 0; --end: 4">
    <div class="film__title">
      <p class="film__line">أذكار يومك في مكان</p>
    </div>
    <div class="film__screen film__screen--blank" style="--screen: 520px">
      لقطة: الصفحة الرئيسية
    </div>
  </section>

  <section
    class="film__scene film__scene--tone"
    data-occasion="sabah-masaa"
    style="--start: 4; --end: 8.5"
  >
    <div class="film__title">
      <p class="film__line" data-motion="enter" style="--at: 0.1">الصباح والمساء</p>
      <p class="film__line film__line--small" data-motion="enter" style="--at: 0.5">
        ومع كل ذكر تخريجه
      </p>
    </div>
    <svg class="film__emblem" data-emblem="sabah-masaa" style="--at: 0.3"></svg>
  </section>

  <section class="film__scene" style="--start: 8.5; --end: 13.4">
    <div class="film__title">
      <p class="film__line film__line--small" data-motion="enter" style="--at: 0.1">
        الأقسام كلها في صفحة
      </p>
    </div>
    <div class="film__screen film__screen--blank" data-motion="grow" style="--at: 0.3">
      لقطة: الصفحة الرئيسية
    </div>
  </section>

  <section class="film__scene film__scene--center" style="--start: 13.4; --end: 16">
    <div class="film__end">
      <div class="film__brand" data-motion="grow" style="--at: 0.1">
        <svg class="film__mark" data-mark></svg>
        <span class="film__name">وِردي</span>
      </div>
      <span class="film__domain" data-motion="fade" style="--at: 0.6">wirdy.site</span>
    </div>
  </section>
</main>
