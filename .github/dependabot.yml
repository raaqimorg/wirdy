version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["📦 dependencies"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # astro check refuses TypeScript 7.0; drop this once Astro supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["📦 dependencies"]
    commit-message:
      prefix: "chore(ci)"
