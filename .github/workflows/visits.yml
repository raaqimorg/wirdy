name: Visits

on:
  schedule:
    - cron: "41 * * * *"
    - cron: "7 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visits-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  report:
    name: Report
    if: github.repository == 'raaqimorg/wirdy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Send the report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
          REPORT: ${{ github.event.schedule == '7 4 * * *' && 'morning' || github.event_name == 'workflow_dispatch' && 'hourly --silent' || 'hourly' }}
        run: bun run visits $REPORT
